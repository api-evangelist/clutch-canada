aid: clutch-canada
name: Clutch Canada
description: 'Clutch is a Toronto-headquartered, vertically integrated online used-car
  retailer serving Canadian drivers. Unlike marketplace models that broker to third-party
  dealers, Clutch owns its own inventory and runs an end-to-end e-commerce purchase
  flow at clutch.ca: browsing reconditioned pre-owned vehicles, auto financing and
  a loan calculator, trade-in and sell-my-car offers, protection plans, insurance,
  and home delivery, backed by a 10-day money-back guarantee. It operates across Ontario,
  Nova Scotia, New Brunswick and Prince Edward Island. Clutch is a consumer retail
  business rather than an API vendor: its software is shipped as an end-user web
  application, and it publishes no public developer program, API reference, or
  machine-readable specification.'
